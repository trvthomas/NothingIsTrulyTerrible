<!DOCTYPE html>
<html lang="en">

<head>
    <title>Test Gyroscope</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/parallax/3.1.0/parallax.min.js"></script>
    <style>
        .yea div{
            animation: floatAnimation 1s ease-in-out infinite alternate;
        }

        @keyframes floatAnimation {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(1deg);
            }
        }
    </style>
</head>

<body>
    <button id="btnPermission" onclick="gyro()" disabled>enable parallax</button>
    <div class="main-wrapper-scene">
        <div id="main-scene">
            <div data-depth="0.4" class="yea">
                <div>
                    test?
                </div>
            </div>
            <div data-depth="0.6">test2</div>
        </div>
    </div>

    <div>
        <br /><br />Logs:
        <div id="logs"></div>
    </div>

    <script>
        let scene = document.getElementById('main-scene');
        let parallaxInstance;
        let enableButton = document.getElementById('btnPermission');
        document.addEventListener('DOMContentLoaded', () => {
            const ua = navigator.userAgent;

            const isIOS = /iPhone|iPad|iPod/.test(ua);
            const isIPadOS = ua.includes('Macintosh') && navigator.maxTouchPoints > 1;

            if (isIOS || isIPadOS) {
                addLog("Apple device detected");
                enableButton.disabled = false;
            } else {
                addLog("non ios or touch, starting")
                parallaxInstance = new Parallax(scene);
            }
        });

        function gyro() {
            DeviceOrientationEvent
                .requestPermission()
                .then(() => {
                    parallaxInstance = new Parallax(scene, {
                        relativeInput: true,
                        hoverOnly: false,
                        invertX: false,
                        invertY: false,
                        scalarX: 15.0,  // Boost sensitivity to verify movement
                        scalarY: 15.0
                    });
                    enableButton.disabled = true;
                });
            addLog("yei!")
        }

        function addLog(message) {
            const logsDiv = document.getElementById('logs');
            const logEntry = document.createElement('p');
            logEntry.textContent = message;
            logsDiv.appendChild(logEntry);
        }
    </script>
</body>

</html>
